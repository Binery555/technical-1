<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MT5 Mobile Trade Screen - Standalone</title>
<style>
  :root{
    --bg:#000000;
    --text:#f2f2f2;
    --section:#36383c;
    --blue:#3d93ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;background:var(--bg);color:var(--text);
    font-family: Roboto, "Segoe UI", Arial, Helvetica, sans-serif;
    font-variant-numeric: tabular-nums lining-nums;
  }
  body{display:flex;justify-content:center;min-height:100vh}
  img{display:block;max-width:100%}
  .phone{width:100%;max-width:430px;min-height:100vh;background:#000;position:relative;overflow:hidden;padding-bottom:92px}
  .topbar{display:grid;grid-template-columns:44px 1fr 34px 34px 34px;align-items:center;column-gap:10px;padding:12px 12px 6px}
  .menu{font-size:29px;line-height:1;text-align:center;color:#fff}
  .trade-box .title{font-size:19px;font-weight:500;margin-bottom:2px}
  .trade-box .amount{color:var(--blue);font-size:18px;font-weight:500;letter-spacing:0.2px}
  .top-icon{width:28px;height:28px;object-fit:contain;justify-self:center;filter:brightness(1.04)}
  .metrics{padding:6px 14px 12px}
  .metric{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;min-height:32px;font-size:16px;font-weight:600}
  .metric .value{font-size:16px;font-weight:700;letter-spacing:0.2px}
  .dots{height:1px;background-image:radial-gradient(circle, rgba(122,128,137,.9) 1.4px, transparent 1.8px);background-size:10px 3px;background-repeat:repeat-x;background-position:center;opacity:.8}
  .section-head{height:42px;background:var(--section);display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-top:1px solid #45484c;border-bottom:1px solid #1b1d20}
  .section-head .title{font-size:17px;font-weight:700;color:#bfc3c9}
  .section-head .more{font-size:24px;color:#c0c3c8;margin-top:-8px;letter-spacing:1px}
  .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:11px 14px 4px;border-bottom:1px solid #2f363c;min-height:67px}
  .pair{font-size:16px;font-weight:700;line-height:1.15}
  .pair .side,.pair .lot{color:var(--blue);font-weight:500}
  .price-line{margin-top:3px;font-size:15px;color:#c0c4ca;font-weight:700;letter-spacing:0.2px}
  .profit{color:var(--blue);font-size:18px;font-weight:700;min-width:48px;text-align:right}
  .bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;height:82px;background:#000;border-top:1px solid #111;display:grid;grid-template-columns:repeat(5,1fr)}
  .nav-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#f0f0f0;font-size:11px;padding-top:2px}
  .nav-item.active{color:var(--blue)}
  .nav-icon{width:44px;height:44px;object-fit:contain}
  .trade-icon{width:24px;height:24px;object-fit:contain;display:block;margin:-6px auto 6px;filter:brightness(1.05);transform:translateY(-5px)}
  .trade-pill{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#17345f;color:var(--blue);border-radius:14px;min-width:64px;height:22px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;padding:0 10px}
  .badge{position:absolute;right:12px;top:9px;width:18px;height:18px;border-radius:50%;background:#f23333;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
</style>
</head>

<script>
/*

    profit = (currentPrice - openPrice) × 100 × lot
*/

const account = {
  balance: 1083.76,
  margin: 112.01
};

const positions = [
  {open:4479.935, lot:0.01, side:"buy"},

  {open:4479.961, lot:0.01, side:"buy"},
  {open:4479.739, lot:0.01, side:"buy"}
];

let currentPrice = 4484.226;

// Market-like internal state
let momentum = 0.0;
let trendBias = 0.0;
let volatility = 0.018;
let tickCount = 0;
let burstTicks = 0;
let burstDirection = 0;

const money = n => n.toLocaleString("en-US", {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
}).replace(/,/g, " ");

const priceText = n => n.toLocaleString("en-US", {
  minimumFractionDigits: 3,
  maximumFractionDigits: 3
}).replace(/,/g, " ");

function positionProfit(p) {
  const contractSize = 100;
  const direction = p.side === "buy" ? 1 : -1;
  return (currentPrice - p.open) * contractSize * p.lot * direction;
}

function renderPositions() {
  document.getElementById("list").innerHTML = positions.map((p) => {
    const pnl = positionProfit(p);
    return `
      <div class="row">
        <div>
          <div class="pair">XAUUSDm, <span class="side">${p.side}</span> <span class="lot">${p.lot.toFixed(2)}</span></div>
          <div class="price-line">${priceText(p.open)} → ${priceText(currentPrice)}</div>
        </div>
        <div class="profit">${pnl.toFixed(2)}</div>
      </div>
    `;
  }).join("");
}

function updateAccount() {
  const floating = positions.reduce((sum, p) => sum + positionProfit(p), 0);
  const equity = account.balance + floating;
  const freeMargin = equity - account.margin;
  const marginLevel = account.margin > 0 ? (equity / account.margin) * 100 : 0;

  document.querySelector(".trade-box .amount").textContent = money(floating) + " USD";

  const values = document.querySelectorAll(".metric .value");
  values[0].textContent = money(account.balance);
  values[1].textContent = money(equity);
  values[2].textContent = money(account.margin);
  values[3].textContent = money(freeMargin);
  values[4].textContent = money(marginLevel);

  document.querySelector(".trade-pill").textContent = money(floating);
}

function gaussianNoise() {
  // Box-Muller transform for less artificial random movement
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

function marketTick() {
  tickCount++;

  // Change volatility regime from time to time.
  if (tickCount % 28 === 0) {
    const r = Math.random();
    volatility = r < 0.15 ? 0.050 : (r < 0.45 ? 0.030 : 0.017);
  }

  // Slowly changing short-term trend.
  if (tickCount % 18 === 0) {
    trendBias += (Math.random() - 0.5) * 0.012;
    trendBias *= 0.70;
  }

  // Occasional short burst, similar to a quick market impulse.
  if (burstTicks <= 0 && Math.random() < 0.045) {
    burstTicks = 3 + Math.floor(Math.random() * 7);
    burstDirection = Math.random() < 0.5 ? -1 : 1;
  }

  let burst = 0;
  if (burstTicks > 0) {
    burst = burstDirection * (0.020 + Math.random() * 0.030);
    burstTicks--;
  }

  // Momentum + random noise gives smoother but still active ticks.
  const shock = gaussianNoise() * volatility;
  momentum = momentum * 0.72 + shock * 0.48 + trendBias + burst;

  // Prevent exaggerated single-tick jumps.
  momentum = Math.max(-0.095, Math.min(0.095, momentum));

  currentPrice += momentum;

  // Keep 3-decimal style, like XAUUSD quote display.
  currentPrice = Math.round(currentPrice * 1000) / 1000;

  renderPositions();
  updateAccount();

  // Randomized tick interval looks more natural than a fixed timer.
  const nextTick = 170 + Math.floor(Math.random() * 230); // ~170–400 ms
  setTimeout(marketTick, nextTick);
}

renderPositions();
updateAccount();
setTimeout(marketTick, 250);
